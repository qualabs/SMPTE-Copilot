# Example configuration file for SMPTE-Copilot RAG system
# Copy this file to config.yaml and modify as needed

loader:
  file_type_mapping:         # Map file extensions to loader types (required)
    # Format: list of entries, each with a list of extensions that use the same loader
    # This avoids repeating loader configurations for multiple file types
    - extensions: [.pdf, .docx]  # Multiple extensions can share the same loader config
      loader_name: docling
      loader_config: 
        llm_api_key: # LLM key for used for image description
        llm_endpoint: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions # LLM endpoint for image description
        llm_model: gemini-2.5-flash # Model for image description
        image_description_timeout: 60  # Timeout in seconds for image description generation
        # image_description_prompt: "Analyze the image exhaustively. Do not summarize; extract details." # Optional prompt for image description if not present uses default
    - extensions: [.mp4]
      loader_name: whisper
      loader_config:
        model_name: base  # Whisper model: tiny, base, small, medium, large (default: base)
        device: cpu  # Device to run on: cpu or cuda (default: cpu)
        language: en  # Language code (e.g., "en", "es") or null for auto-detection (default: en)
        include_timestamps: true  # Include timestamps in markdown output (default: true)

preprocessing:
  preprocessing_name: rapidfuzz  # Preprocessor type (rapidfuzz)
  preprocessing_config:      # Preprocessor-specific configuration
    min_repetitions: 3       # Minimum number of times a line must appear (or be similar) to be considered repeated (default: 3)
    similarity_threshold: 0.85  # Minimum similarity ratio for fuzzy matching (0.0 to 1.0, default: 0.85)

chunking:
  chunker_name: langchain    # Chunker name (langchain, hybrid)
  chunker_config:            # Chunker-specific configuration (recommended)
    chunk_size: 1000         # Size of text chunks in characters (for langchain)
    chunk_overlap: 200       # Overlap between chunks in characters (for langchain)
    method: recursive         # Options: recursive, character, token (for langchain)
  # For hybrid chunking (semantic + token-based):
  # chunker_name: hybrid
  # chunker_config:
  #   max_tokens: 2000        # Maximum tokens per chunk (default: 2000)
  #   merge_peers: false      # Whether to merge peer chunks (default: false)
  #   tokenizer: simple       # Tokenizer type: simple (default) or gemini
  #   tokenizer_config:       # Tokenizer-specific configuration
  #     # For gemini tokenizer:
  #     # llm_api_key: "${GOOGLE_API_KEY}"  # Google API key for accurate token counting
  #     # llm_model: "gemini-embedding-001"        # Gemini model for token counting
  #     # For simple tokenizer: no additional config needed
  # Note: chunk_size and chunk_overlap are NOT used by hybrid chunker (it's token-based)
  
embedding:
  embed_name: huggingface    # Options: huggingface, openai, gemini
  embed_config:              # Additional model-specific arguments (dict)
    # For HuggingFace models, you can specify the specific model name:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"  # Default if not specified
    # For OpenAI, you would specify:
    # model_name: "text-embedding-3-small"  # or other OpenAI embedding model
    # For Gemini, you would specify:
    # model_name: "embedding-001"  # or other Gemini embedding model
    # google_api_key: 

vector_store:
  store_name: chromadb        # Vector store name (options: chromadb, qdrant)
  store_config:               # Store-specific configuration (dict)
    persist_directory: ./vector_db  # Directory to persist vector store data (relative to current working directory)
    collection_name: rag_collection    # Collection name in the vector store
  # For Qdrant, include url in store_config:
  # store_name: qdrant
  # store_config:
  #   persist_directory: ./vector_db
  #   collection_name: rag_collection
  #   url: http://qdrant:6333  # Qdrant server URL

retrieval:
  searcher_strategy: similarity  # Retrieval strategy
  k: 5                          # Number of results to retrieve
  searcher_config: null         # Additional searcher-specific configuration (dict)

llm:
  llm_name: gemini
  llm_config:
    model: gemini-2.5-flash
    api_key: 

paths:
  input_path: ./data         # Default path for input media files (relative to current working directory)
  markdown_dir: ./data/markdown  # Directory for markdown output (relative to current working directory)

logging:
  level: INFO                    # Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)

access_control:
  # Ingestion settings (applied to all ingested documents)
  default_access_tags: ["Public"]        # Default access tags for ingested documents (e.g., ["Finance", "Public"])
  default_required_role: "Protected"    # Default required role for strict access control (e.g., "Finance_Manager")
  
  # Query settings (applied to all queries)
  default_user_role: "Public"   # Default user role for query access control (e.g., "Finance_Manager")
  default_user_tags: ["Public"] # Default user tags for query access control (e.g., ["Finance", "Public"])
  role_mapping_file: null       # Path to JSON file containing role-to-tags mapping (e.g., "./role_mapping.json")