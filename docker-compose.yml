services:
  # Qdrant vector database service (optional - only needed when using Qdrant)
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # Service for ingesting documents
  ingest:
    build: .
    image: rag-poc-v1
    container_name: rag-ingest
    volumes:
      - vector_db:/app/vector_db
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./access_mapping.json:/app/access_mapping.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: python src/cli/ingest.py --help

  # Service for querying documents
  query:
    build: .
    image: rag-poc-v1
    container_name: rag-query
    volumes:
      - vector_db:/app/vector_db
      - ./config.yaml:/app/config.yaml:ro
      - ./access_mapping.json:/app/access_mapping.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: python src/cli/query.py --help

  # API Server - OpenAI-compatible endpoint
  api:
    build: .
    image: rag-poc-v1
    container_name: smpte-api-server
    ports:
      - "8000:8000"
    volumes:
      - vector_db:/app/vector_db
      - ./config.yaml:/app/config.yaml:ro
      - ./access_mapping.json:/app/access_mapping.json:ro
      - ./user_mapping.json:/app/user_mapping.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # OpenWebUI - Chat interface with Google OAuth
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://api:8000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
      # Forward user info headers to API for role-based access
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      # Google OAuth only (disable email/password login)
      - ENABLE_LOGIN_FORM=false
      - ENABLE_OAUTH_SIGNUP=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENID_PROVIDER_URL=https://accounts.google.com/.well-known/openid-configuration
      - WEBUI_URL=${CALLBACK_WEBUI_URL}
      # Branding
      - WEBUI_NAME=${WEBUI_NAME:-SMPTE Copilot}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-en}
      # Model configuration - restrict to SMPTE Copilot model only
      - DEFAULT_MODELS=smpte-copilot
      - MODEL_FILTER_ENABLED=true
      - MODEL_FILTER_LIST=smpte-copilot
      # Disable unused features
      - ENABLE_IMAGE_GENERATION=false
      - ENABLE_COMMUNITY_SHARING=false
      # RAG settings (handled by our custom backend, disable built-in)
      - ENABLE_RAG_WEB_SEARCH=false
      - ENABLE_RAG_LOCAL_WEB_FETCH=false
    volumes:
      - openwebui-data:/app/backend/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  vector_db:
  qdrant_storage:
  openwebui-data:
